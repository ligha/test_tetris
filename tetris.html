<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル・テトリス</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            gap: 20px;
            border: 4px solid #fff;
            padding: 20px;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            border: 2px solid #ccc;
            background-color: #111;
        }

        #info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-width: 120px;
        }

        .score-label {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #next-canvas {
            border: 2px solid #ccc;
            background-color: #111;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 40px;
            text-shadow: 2px 2px #ff00ff;
        }

        .controls {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>TETRIS</h1>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div id="info">
            <div class="score-label">SCORE<br><span id="score">0</span></div>
            <div class="score-label">NEXT</div>
            <canvas id="next-canvas" width="80" height="80"></canvas>
            <div class="controls">
                操作方法:<br>
                ← → : 移動<br>
                ↑ : 回転<br>
                ↓ : 加速
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');

        context.scale(20, 20);
        nextContext.scale(20, 20);

        function createPiece(type) {
            if (type === 'I') {
                return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            } else if (type === 'L') {
                return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
            } else if (type === 'J') {
                return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
            } else if (type === 'O') {
                return [[4, 4], [4, 4]];
            } else if (type === 'Z') {
                return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
            } else if (type === 'S') {
                return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            } else if (type === 'T') {
                return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
            }
        }

        const colors = [
            null,
            '#FF0D72', // I
            '#0DC2FF', // L
            '#0DFF72', // J
            '#F538FF', // O
            '#FF8E0D', // Z
            '#FFE138', // S
            '#3877FF', // T
        ];

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function drawMatrix(ctx, matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 0.05;
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }
